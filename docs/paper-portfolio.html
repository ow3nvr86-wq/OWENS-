<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paper Portfolio</title>
<meta name="description" content="Practice investing with pretend money and real stock and ETF prices.">
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f2; --surface:#fcfcfb; --surface-2:#f0efec; --border:#dddcd6;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#6e6d68;
  --accent:#2a78d6; --accent-ink:#1c5cab; --on-accent:#ffffff;
  --gain:#0b7a0b; --loss:#c42b2b; --warn-bg:#fff4dc; --warn-ink:#6b4a00;
  --series-1:#2a78d6; --series-2:#eb6834; --band:rgba(42,120,214,.16);
  --grid:#e6e5e0; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#34342f;
    --text:#ffffff; --text-2:#c3c2b7; --text-3:#9d9c93;
    --accent:#3987e5; --accent-ink:#86b6ef; --on-accent:#ffffff;
    --gain:#4cc24c; --loss:#ff7b72; --warn-bg:#3a2e10; --warn-ink:#ffd58a;
    --series-1:#3987e5; --series-2:#d95926; --band:rgba(57,135,229,.22);
    --grid:#2c2c29; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#34342f;
  --text:#ffffff; --text-2:#c3c2b7; --text-3:#9d9c93;
  --accent:#3987e5; --accent-ink:#86b6ef; --on-accent:#ffffff;
  --gain:#4cc24c; --loss:#ff7b72; --warn-bg:#3a2e10; --warn-ink:#ffd58a;
  --series-1:#3987e5; --series-2:#d95926; --band:rgba(57,135,229,.22);
  --grid:#2c2c29; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.top-inner{max-width:960px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand h1{font-size:18px;margin:0;letter-spacing:-.01em}
.mkt{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);display:inline-block}
.dot.open{background:var(--gain)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 12px;border-bottom:2px solid transparent;color:var(--text-2);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.row-btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:16px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600}
.card h3{font-size:14px;margin:16px 0 8px;font-weight:600}
.muted{color:var(--text-2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--text-3)}
.hero{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end}
.hero .big{font-size:34px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--text-2)}
.stat .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.gain{color:var(--gain)} .loss{color:var(--loss)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.buy{background:#0b7a0b;border-color:#0b7a0b;color:#fff}
.btn.sell{background:#c42b2b;border-color:#c42b2b;color:#fff}
.btn.danger{color:var(--loss)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:500;color:var(--text-2)}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.table-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:500;color:var(--text-2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
th.num{text-align:right}
td{padding:9px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr:last-child td{border-bottom:0}
.row-btn{background:none;border:0;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.sym{font-weight:650}
.sub{font-size:12px;color:var(--text-2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);font-weight:500;white-space:nowrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.chip:hover{background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.empty{padding:24px 8px;text-align:center;color:var(--text-2)}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:16px}
.notice.info{background:var(--surface-2);color:var(--text-2)}
.progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.progress > div{height:100%;background:var(--accent);border-radius:999px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.alloc{display:flex;flex-direction:column;gap:8px}
.alloc .a-row{display:grid;grid-template-columns:70px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.alloc .bar{height:10px;border-radius:0 4px 4px 0;background:var(--series-1);min-width:2px}
.alloc .bar.cash{background:var(--text-3)}
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;display:none;z-index:2}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.band{height:10px;background:var(--band)}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--series-1) 0 4px,transparent 4px 7px)}
.detail-head{display:flex;gap:12px;align-items:center}
.detail-head img{width:40px;height:40px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:480px){nav.tabs button{padding:10px 8px;font-size:14px}.top-inner{padding-left:10px;padding-right:10px}}
@media (max-width:720px){.grid2{grid-template-columns:1fr}.hero .big{font-size:28px}}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--text-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.tv{width:100%;height:340px;border:0;border-radius:8px;margin-top:12px;background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.results{display:flex;flex-direction:column;margin-top:8px}
.results button{display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--grid);padding:10px 4px;cursor:pointer;text-align:left}
.results button:hover{background:var(--surface-2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.setup{max-width:520px;margin:32px auto}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
ol.steps{padding-left:20px;margin:6px 0 0}
ol.steps li{margin-bottom:4px}
</style>
</head>
<body>
<header class="top" id="topbar" hidden>
  <div class="top-inner">
    <div class="brand">
      <h1>Paper Portfolio</h1>
      <div class="mkt" id="mkt"><span class="dot"></span><span>Checking market…</span></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
/* ---------------------------------------------------------------- storage */
const KEY = "paperPortfolio.v1";
const API = "https://finnhub.io/api/v1/";
const BENCH = "SPY";
const SYM_RE = /^[A-Z0-9][A-Z0-9.\-]{0,14}$/;

function todayISO(d = new Date()) { return d.toLocaleDateString("en-CA"); }
function addMonths(iso, n) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1 + n, d);
  return todayISO(dt);
}
function daysBetween(a, b) {
  const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 864e5);
}

function blankState() {
  return {
    v: 1, apiKey: "", started: false,
    setup: { name: "", startCash: 10000, startDate: todayISO(), endDate: addMonths(todayISO(), 4) },
    cash: 10000, positions: {}, txns: [], watch: ["SPY", "QQQ", "AAPL", "NVDA"],
    history: [], bench: { sym: BENCH, start: null },
    last: {}, metrics: {}, names: {},
    settings: { fractional: true, realistic: false, theme: "auto", charts: true }
  };
}
let S = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { /* storage blocked or corrupt */ }
  return blankState();
}
function normalize(o) {
  const b = blankState();
  if (!o || typeof o !== "object") return b;
  const s = Object.assign(b, o);
  s.setup = Object.assign(blankState().setup, o.setup || {});
  s.settings = Object.assign(blankState().settings, o.settings || {});
  s.bench = Object.assign({ sym: BENCH, start: null }, o.bench || {});
  for (const k of ["positions", "last", "metrics", "names"]) if (!s[k] || typeof s[k] !== "object" || Array.isArray(s[k])) s[k] = {};
  for (const k of ["txns", "watch", "history"]) if (!Array.isArray(s[k])) s[k] = [];
  s.watch = s.watch.filter(x => typeof x === "string" && SYM_RE.test(x));
  for (const [k, p] of Object.entries(s.positions)) {
    if (!SYM_RE.test(k) || !p || !(p.shares > 0) || !isFinite(p.cost)) delete s.positions[k];
  }
  if (!isFinite(s.cash)) s.cash = s.setup.startCash;
  return s;
}
let saveFailed = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); saveFailed = false; }
  catch (e) { if (!saveFailed) toast("Couldn't save. Your browser is blocking storage, so export a backup in Settings."); saveFailed = true; }
}

/* ---------------------------------------------------------------- formatting */
const fmtUSD = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const fmtUSD0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const money = n => Number.isFinite(n) ? fmtUSD.format(n) : "–";
const money0 = n => Number.isFinite(n) ? fmtUSD0.format(n) : "–";
const zap = (n, eps) => Math.abs(n) < eps ? 0 : n; // hide sub-cent rounding noise
const sMoney = n => !Number.isFinite(n) ? "–" : (n = zap(n, 0.005), (n > 0 ? "+" : n < 0 ? "−" : "") + fmtUSD.format(Math.abs(n)));
const pct = (n, dp = 2) => !Number.isFinite(n) ? "–" : (n = zap(n, 0.5 * Math.pow(10, -dp)), (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(dp) + "%");
const shares = n => (+n).toLocaleString("en-US", { maximumFractionDigits: 6 });
const cls = n => n > 0.004 ? "gain" : n < -0.004 ? "loss" : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (ms) => new Date(ms).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const fmtDay = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
const round6 = x => Math.floor(x * 1e6 + 1e-7) / 1e6;

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3800);
}

/* ---------------------------------------------------------------- api (Finnhub, free tier: 60 calls/min) */
const callTimes = [];
let active = 0; const waiting = [];
function slot() {
  return new Promise(res => { waiting.push(res); pump(); });
}
function pump() {
  const now = Date.now();
  while (callTimes.length && now - callTimes[0] > 60000) callTimes.shift();
  if (!waiting.length || active >= 4) return;
  if (callTimes.length >= 55) { setTimeout(pump, 60000 - (now - callTimes[0]) + 50); return; }
  active++; callTimes.push(now); waiting.shift()();
}
class ApiError extends Error { constructor(code, msg) { super(msg); this.code = code; } }
async function api(path, params = {}, key = S.apiKey) {
  if (!key) throw new ApiError("nokey", "Add your free Finnhub key in Settings to load prices.");
  const qs = new URLSearchParams(Object.assign({}, params, { token: key }));
  await slot();
  try {
    let r;
    try { r = await fetch(API + path + "?" + qs.toString()); }
    catch (e) { throw new ApiError("network", "Can't reach the price service. Check your connection."); }
    if (r.status === 401 || r.status === 403) throw new ApiError("key", "The price service rejected your API key. Check it in Settings.");
    if (r.status === 429) throw new ApiError("rate", "Too many price requests at once. Waiting a minute will fix it.");
    if (!r.ok) throw new ApiError("http", "Price service error (" + r.status + ").");
    return await r.json();
  } finally { active--; pump(); }
}
const quotes = {}; // in-memory: SYM -> {c,d,dp,h,l,o,pc,t,at}
async function getQuote(sym, maxAge = 30000) {
  const q = quotes[sym];
  if (q && Date.now() - q.at < maxAge) return q;
  const d = await api("quote", { symbol: sym });
  if (!d || !(d.c > 0)) throw new ApiError("notfound", sym + " has no price. It may be delisted or not a US listing.");
  d.at = Date.now(); quotes[sym] = d; S.last[sym] = d.c;
  return d;
}
function price(sym) { return quotes[sym]?.c ?? S.last[sym]; }
async function getMetrics(sym) {
  const m = S.metrics[sym];
  if (m && Date.now() - m.at < 864e5) return m;
  const d = await api("stock/metric", { symbol: sym, metric: "all" });
  const x = (d && d.metric) || {};
  const out = {
    r52: num(x["52WeekPriceReturnDaily"]), beta: num(x.beta),
    hi: num(x["52WeekHigh"]), lo: num(x["52WeekLow"]), ytd: num(x.yearToDatePriceReturnDaily),
    mcap: num(x.marketCapitalization), pe: num(x.peTTM ?? x.peNormalizedAnnual), div: num(x.dividendYieldIndicatedAnnual ?? x.currentDividendYieldTTM),
    at: Date.now()
  };
  S.metrics[sym] = out; return out;
}
function num(v) { return typeof v === "number" && isFinite(v) ? v : null; }

/* ---------------------------------------------------------------- market hours */
let marketOpen = false;
function nyMarketOpen(d = new Date()) {
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "numeric", hour12: false }).formatToParts(d).map(p => [p.type, p.value]));
  if (parts.weekday === "Sat" || parts.weekday === "Sun") return false;
  const mins = (Number(parts.hour) % 24) * 60 + Number(parts.minute);
  return mins >= 570 && mins < 960;
}
async function checkMarket() {
  marketOpen = nyMarketOpen();
  try {
    const d = await api("stock/market-status", { exchange: "US" });
    if (d && typeof d.isOpen === "boolean") marketOpen = d.isOpen;
  } catch (e) { /* fall back to clock */ }
  const el = document.getElementById("mkt");
  el.innerHTML = `<span class="dot ${marketOpen ? "open" : ""}"></span><span>US market ${marketOpen ? "open" : "closed"}</span>`;
}

/* ---------------------------------------------------------------- portfolio math */
function holdingsValue() {
  let v = 0;
  for (const [sym, p] of Object.entries(S.positions)) v += p.shares * (price(sym) ?? p.cost / p.shares);
  return v;
}
function totalValue() { return S.cash + holdingsValue(); }
function dayChange() {
  let d = 0;
  for (const [sym, p] of Object.entries(S.positions)) { const q = quotes[sym]; if (q && isFinite(q.d)) d += p.shares * q.d; }
  return d;
}
function pendingBuyReserve() {
  return S.txns.filter(t => t.status === "pending" && t.side === "buy").reduce((a, t) => a + (t.amount ?? t.shares * (price(t.sym) || 0)), 0);
}
function pendingSellShares(sym) {
  return S.txns.filter(t => t.status === "pending" && t.side === "sell" && t.sym === sym).reduce((a, t) => a + t.shares, 0);
}
function benchValue() {
  const p = price(BENCH);
  if (!S.bench.start || !p) return null;
  return S.setup.startCash * p / S.bench.start;
}
function recordSnapshot() {
  if (!S.started) return;
  const syms = Object.keys(S.positions);
  if (syms.some(s => price(s) == null)) return;
  const d = todayISO();
  const pt = { d, v: +totalValue().toFixed(2), b: benchValue() != null ? +benchValue().toFixed(2) : null };
  const last = S.history[S.history.length - 1];
  if (last && last.d === d) S.history[S.history.length - 1] = pt; else S.history.push(pt);
  save();
}

/* ---------------------------------------------------------------- orders */
function placeOrder({ side, sym, mode, qty }) {
  const p = price(sym);
  if (!p) return { ok: false, msg: "No price yet for " + sym + "." };
  if (!(qty > 0)) return { ok: false, msg: "Enter an amount above zero." };
  let sh, amount = null;
  if (mode === "dollars") { amount = Math.round(qty * 100) / 100; sh = amount / p; }
  else sh = qty;
  if (!S.settings.fractional) {
    if (mode === "shares" && Math.abs(sh - Math.round(sh)) > 1e-9) return { ok: false, msg: "Whole shares only. Turn on fractional shares in Settings to buy parts of a share." };
    sh = Math.floor(sh + 1e-9);
    if (amount != null) amount = null;
  } else sh = round6(sh);
  if (!(sh > 0)) return { ok: false, msg: S.settings.fractional ? "That amount is too small." : "That isn't enough for one whole share at " + money(p) + "." };

  const queue = S.settings.realistic && !marketOpen;
  if (side === "buy") {
    const cost = amount ?? sh * p;
    const avail = S.cash - pendingBuyReserve();
    if (cost > avail + 0.005) return { ok: false, msg: "Not enough cash. You have " + money(avail) + " to spend." };
  } else {
    const own = (S.positions[sym]?.shares || 0) - pendingSellShares(sym);
    if (sh > own + 1e-9) return { ok: false, msg: own > 0 ? "You only have " + shares(own) + " shares to sell." : "You don't own any " + sym + "." };
    if (Math.abs(sh - own) < 1e-6) sh = own;
  }
  const t = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: Date.now(), side, sym, shares: sh, amount: (side === "buy" && amount != null) ? amount : null, price: p, status: "pending" };
  S.txns.unshift(t);
  if (queue) { save(); return { ok: true, msg: "Order queued. It fills at the price when the market next opens." }; }
  fill(t, p); save();
  return { ok: true, msg: (side === "buy" ? "Bought " : "Sold ") + shares(t.shares) + " " + sym + " at " + money(p) + "." };
}
function fill(t, p) {
  if (t.side === "buy") {
    let sh = t.amount != null ? round6(t.amount / p) : t.shares;
    if (!S.settings.fractional) sh = Math.floor(sh + 1e-9);
    const cost = sh * p;
    if (!(sh > 0) || cost > S.cash + 0.005) { t.status = "cancelled"; t.note = "Not enough cash at fill time"; return; }
    S.cash = Math.max(0, S.cash - cost);
    const pos = S.positions[t.sym] || (S.positions[t.sym] = { shares: 0, cost: 0 });
    pos.shares = round6(pos.shares + sh); pos.cost += cost;
    Object.assign(t, { shares: sh, price: p, total: cost, status: "filled", t: Date.now() });
  } else {
    const pos = S.positions[t.sym];
    if (!pos || pos.shares < t.shares - 1e-9) { t.status = "cancelled"; t.note = "Not enough shares at fill time"; return; }
    const sh = Math.min(t.shares, pos.shares);
    const proceeds = sh * p;
    const basis = pos.cost * (sh / pos.shares);
    S.cash += proceeds;
    pos.shares = round6(pos.shares - sh); pos.cost -= basis;
    if (pos.shares < 1e-6) delete S.positions[t.sym];
    Object.assign(t, { shares: sh, price: p, total: proceeds, pl: proceeds - basis, status: "filled", t: Date.now() });
  }
}
async function processPending() {
  if (!marketOpen) return;
  const pend = S.txns.filter(t => t.status === "pending").slice().reverse();
  for (const t of pend) {
    try { const q = await getQuote(t.sym, 0); fill(t, q.c); } catch (e) { /* try next refresh */ }
  }
  if (pend.length) { save(); toast(pend.length + " queued order" + (pend.length > 1 ? "s" : "") + " processed."); }
}

function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(6));
  return out;
}
function lineChart(el, { series, band, height = 230, yFmt = money0 }) {
  el.innerHTML = "";
  const W = Math.max(280, el.clientWidth), H = height, m = { l: 62, r: 14, t: 10, b: 26 };
  const pts = series.flatMap(s => s.points).concat(band ? band.lo.concat(band.hi) : []);
  if (!pts.length) return;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 864e5; x1 += 864e5; }
  const yt = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = yt[0], y1 = yt[yt.length - 1];
  const X = x => m.l + (x - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = y => H - m.b - (y - y0) / (y1 - y0 || 1) * (H - m.t - m.b);
  const ns = "http://www.w3.org/2000/svg";
  let svg = `<svg xmlns="${ns}" viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(series.map(s => s.name).join(" vs "))} chart">`;
  for (const v of yt) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${esc(yFmt(v))}</text>`;
  const nx = Math.min(4, Math.max(2, Math.floor((W - m.l) / 110)));
  for (let i = 0; i <= nx; i++) {
    const x = x0 + (x1 - x0) * i / nx;
    svg += `<text x="${X(x)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nx ? "end" : "middle"}" font-size="11" fill="var(--text-3)">${esc(new Date(x).toLocaleDateString(undefined, { month: "short", day: "numeric" }))}</text>`;
  }
  if (band) {
    const d = band.hi.map((p, i) => (i ? "L" : "M") + X(p.x) + " " + Y(p.y)).join("") + band.lo.slice().reverse().map(p => "L" + X(p.x) + " " + Y(p.y)).join("") + "Z";
    svg += `<path d="${d}" fill="var(--band)"/>`;
  }
  for (const s of series) {
    if (s.points.length === 1) { const p = s.points[0]; svg += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; continue; }
    const d = s.points.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join("");
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>`;
  }
  svg += `<line class="xh" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-3)" stroke-width="1" visibility="hidden"/>`;
  svg += series.map((s, i) => `<circle class="hd" data-i="${i}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`).join("");
  svg += `<rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  el.innerHTML = svg;
  const root = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = root.querySelector(".xh"), dots = root.querySelectorAll(".hd");
  const allX = [...new Set(series.flatMap(s => s.points.map(p => p.x)).concat(band ? band.lo.map(p => p.x) : []))].sort((a, b) => a - b);
  const nearest = (arr, x) => arr.reduce((b, p) => Math.abs(p.x - x) < Math.abs(b.x - x) ? p : b, arr[0]);
  function move(ev) {
    const r = root.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    const xv = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    const xn = allX.reduce((b, x) => Math.abs(x - xv) < Math.abs(b - xv) ? x : b, allX[0]);
    xh.setAttribute("x1", X(xn)); xh.setAttribute("x2", X(xn)); xh.setAttribute("visibility", "visible");
    let rows = `<div class="muted">${esc(new Date(xn).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }))}</div>`;
    series.forEach((s, i) => {
      const p = s.points.length ? nearest(s.points, xn) : null;
      if (!p || Math.abs(p.x - xn) > 864e5 * 1.5) { dots[i].setAttribute("visibility", "hidden"); return; }
      dots[i].setAttribute("cx", X(p.x)); dots[i].setAttribute("cy", Y(p.y)); dots[i].setAttribute("visibility", "visible");

    tip.style.left = Math.min(Math.max(0, tx + 12), r.width - tw) + "px";
    tip.style.top = "4px";
    if (tx + 12 + tw > r.width && tx - tw - 12 > 0) tip.style.left = (tx - tw - 12) + "px";
  }
  function leave() { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); }
  root.addEventListener("pointermove", move); root.addEventListener("pointerdown", move); root.addEventListener("pointerleave", leave);
}
const isoMs = iso => { const [y, mo, d] = iso.split("-").map(Number); return new Date(y, mo - 1, d, 12).getTime(); };

/* ---------------------------------------------------------------- forecast */
function normCdf(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}
function holdingEstimate(sym) {
  const m = S.metrics[sym] || {};
  const beta = m.beta != null ? Math.max(-1, Math.min(3, m.beta)) : 1;
  const capm = 0.04 + beta * 0.05;
  const r52 = m.r52 != null ? Math.max(-0.5, Math.min(0.8, m.r52 / 100)) : null;
  const mu = r52 != null ? 0.5 * r52 + 0.5 * capm : capm;
  let sigma = (m.hi && m.lo && m.hi > m.lo) ? Math.log(m.hi / m.lo) / 1.6 : 0.18 * Math.max(0.5, beta) + 0.08;
  sigma = Math.max(0.1, Math.min(1.2, sigma));
  return { mu, sigma, beta, r52: m.r52 };
}
function forecast() {
  const V = totalValue();
  const end = S.setup.endDate, today = todayISO();
  const days = Math.max(0, daysBetween(today, end));
  const T = days / 365;
  const syms = Object.keys(S.positions);
  const w = syms.map(s => S.positions[s].shares * (price(s) ?? 0) / V);
  const est = syms.map(holdingEstimate);
  const mu = est.reduce((a, e, i) => a + w[i] * e.mu, 0);
  let v = 0;
  for (let i = 0; i < est.length; i++) for (let j = 0; j < est.length; j++) v += w[i] * w[j] * est[i].sigma * est[j].sigma * (i === j ? 1 : 0.6);
  const sigma = Math.sqrt(v);
  const g = Math.log(1 + mu); // mu is treated as the median yearly growth
  const S0 = S.setup.startCash;
  const at = t => ({ mid: V * Math.exp(g * t), lo: V * Math.exp(g * t - 1.2816 * sigma * Math.sqrt(t)), hi: V * Math.exp(g * t + 1.2816 * sigma * Math.sqrt(t)) });
  const endPt = at(T);
  const pGain = sigma * Math.sqrt(T) > 1e-9 ? normCdf((Math.log(V / S0) + g * T) / (sigma * Math.sqrt(T))) : (V * Math.exp(g * T) >= S0 ? 1 : 0);
  const steps = Math.max(2, Math.min(40, days));
  const path = [];
  for (let k = 0; k <= steps; k++) {
    const dd = days * k / steps, t = dd / 365, p = at(t);
    path.push({ x: isoMs(today) + dd * 864e5, ...p });
  }
  return { V, days, T, mu, sigma, endPt, pGain, path, est, syms, w };
}

      <div class="stat"><div class="k">Expected yearly growth</div><div class="v ${cls(f.mu)}">${pct(f.mu * 100, 1)}</div><div class="tiny">swing: about ±${(f.sigma * 100).toFixed(0)}% a year</div></div>
    </div>
    <div class="legend" style="margin-top:16px"><span><i style="background:var(--series-1)"></i>Actual so far</span><span><i class="dash"></i>Most likely path</span><span><i class="band"></i>Likely range</span></div>

  </div>
  <div class="card">
    <h2>What's driving it</h2>
    <div class="table-wrap"><table><thead><tr><th>Holding</th><th class="num">Share of portfolio</th><th class="num">Past year</th><th class="num">Beta</th><th class="num">Est. growth / yr</th><th class="num">Est. swing / yr</th></tr></thead><tbody>
    ${f.syms.map((s, i) => { const e = f.est[i]; return `<tr><td><button class="row-btn" data-sym="${esc(s)}"><span class="sym">${esc(s)}</span></button></td><td class="num">${(f.w[i] * 100).toFixed(1)}%</td><td class="num ${cls(e.r52)}">${e.r52 != null ? pct(e.r52, 1) : "–"}</td><td class="num">${e.beta.toFixed(2)}</td><td class="num ${cls(e.mu)}">${pct(e.mu * 100, 1)}</td><td class="num">±${(e.sigma * 100).toFixed(0)}%</td></tr>`; }).join("")}
    <tr><td><span class="sym">Cash</span></td><td class="num">${(S.cash / f.V * 100).toFixed(1)}%</td><td class="num">0%</td><td class="num">0</td><td class="num">0%</td><td class="num">0%</td></tr>
    </tbody></table></div>
    <h3>How this is worked out</h3>
    <p class="small muted">Each holding's expected growth is half its return over the past year (capped so one wild year doesn't dominate) and half what its beta says it should earn over the long run (about 4% plus 5% times beta). How much it swings comes from its 52-week high and low. Holdings are assumed to move partly together. Cash earns nothing here.</p>

  </div>`;
}
function verdict(f, S0) {
  const cashShare = S.cash / f.V;
  const bits = [];
  if (f.pGain >= 0.65) bits.push("Based on the past year, your mix leans toward growing by the end of the challenge.");
  else if (f.pGain >= 0.5) bits.push("It's close to a coin flip, tilted slightly toward a gain.");
  else bits.push("Right now your mix is more likely to finish below where you started.");
  if (cashShare > 0.4) bits.push(`About ${Math.round(cashShare * 100)}% is sitting in cash, which keeps things steady but can't grow.`);
  if (f.sigma > 0.4) bits.push("Your holdings swing a lot, so the range of outcomes is wide.");
  return bits.join(" ");
}

    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  $("b-imp").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 5e6) return toast("That file is too big to be a backup.");
    try {
      const o = JSON.parse(await f.text());
      if (!o || o.v !== 1 || !o.setup || !o.started) throw new Error();
      if (!confirm("Replace your current portfolio with this backup?")) return;
      const key = S.apiKey; S = normalize(o); S.apiKey = S.apiKey || key; save(); toast("Backup restored."); setTab("portfolio"); refreshAll(true);
    } catch (err) { toast("That isn't a Paper Portfolio backup file."); }
  };
  $("r-go").onclick = () => {
    const cash = Number($("r-cash").value), end = $("r-end").value;
    if (!(cash >= 100 && cash <= 1e8)) return toast("Starting money must be between $100 and $100,000,000.");
    if (!end || daysBetween(todayISO(), end) < 1) return toast("Pick an end date after today.");
    if (!confirm("Erase all trades and start over with " + money(cash) + "?")) return;
    Object.assign(S, { cash, positions: {}, txns: [], history: [], bench: { sym: BENCH, start: price(BENCH) ?? null } });
    S.setup.startCash = cash; S.setup.startDate = todayISO(); S.setup.endDate = end;
    recordSnapshot(); save(); toast("New challenge started."); setTab("portfolio");
  };
}

/* wiring --------------------------------------------------------- */
function afterRender() {
  const app = document.getElementById("app");
  if (tab === "portfolio") {
    const el = document.getElementById("perf");
    if (el && S.history.length) lineChart(el, {
      series: [
        { name: "Your portfolio", color: "var(--series-1)", points: S.history.map(h => ({ x: isoMs(h.d), y: h.v })) },
        { name: "S&P 500 (SPY)", color: "var(--series-2)", points: S.history.filter(h => h.b != null).map(h => ({ x: isoMs(h.d), y: h.b })) }
      ]
    });
  }
  if (tab === "forecast" && Object.keys(S.positions).length) {
    const f = forecast(), el = document.getElementById("fc");
    if (el) lineChart(el, {
      series: [
        { name: "Actual", color: "var(--series-1)", points: S.history.map(h => ({ x: isoMs(h.d), y: h.v })) },
        { name: "Most likely", color: "var(--series-1)", dash: true, points: f.path.map(p => ({ x: p.x, y: p.mid })) }
      ],
      band: { lo: f.path.map(p => ({ x: p.x, y: p.lo })), hi: f.path.map(p => ({ x: p.x, y: p.hi })) }
    });
  }
  if (tab === "trade") {
    const q = document.getElementById("q");
    if (q) q.oninput = () => onSearch(q.value);
    if (detailSym) bindDetail();
  }
  if (tab === "settings") bindSettings();
}
document.getElementById("app").addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); setTab(go.dataset.go); return; }
  const sym = e.target.closest("[data-sym]");
  if (sym) {
    const s = sym.dataset.sym; if (!SYM_RE.test(s)) return;
    if (sym.dataset.name && !S.names[s]) S.names[s] = sym.dataset.name;
    orderSide = "buy"; setTab("trade", s); return;
  }
  const w = e.target.closest("[data-watch]");
  if (w) { const s = w.dataset.watch; S.watch = S.watch.includes(s) ? S.watch.filter(x => x !== s) : [...S.watch, s]; save(); document.getElementById("detail").innerHTML = detailHtml(s); bindDetail(); return; }
  const uw = e.target.closest("[data-unwatch]");
  if (uw) { S.watch = S.watch.filter(x => x !== uw.dataset.unwatch); save(); render(); return; }
  const c = e.target.closest("[data-cancel]");
  if (c) { const t = S.txns.find(x => x.id === c.dataset.cancel); if (t && t.status === "pending") { t.status = "cancelled"; t.note = "Cancelled by you"; save(); render(); } return; }
  if (e.target.closest("[data-refresh]")) { refreshAll(true); toast("Refreshing prices…"); }
});
document.getElementById("topbar").addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); setTab(g.dataset.go); } });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (tab === "portfolio" || tab === "forecast") afterRender(); }, 150); });
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (S.settings.theme === "auto" && tab === "trade" && detailSym) render(); });

render();
if (S.started) { refreshAll(); schedule(); }
</script>
</body>
</html>
