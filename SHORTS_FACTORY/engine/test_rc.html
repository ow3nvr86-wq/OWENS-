<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script><script src="characters.js"></script><script src="effects.js"></script>
<script>const DEBUG = new Set(); let SCRIPT = { charStyle: 'rc' }; let FEAT = { rigV2: true };</script>
<script src="rig2.js"></script><script src="rigrc.js"></script><script src="crowdfx.js"></script><script src="props.js"></script>
<script>
// a cast line-up for look-dev (no episode needed)
const g = document.getElementById('c').getContext('2d');
const bg = g.createLinearGradient(0, 0, 0, 1920); bg.addColorStop(0, '#6a4f9a'); bg.addColorStop(0.6, '#d98a6a'); bg.addColorStop(0.61, '#5f8a45'); bg.addColorStop(1, '#3f6a32');
g.fillStyle = bg; g.fillRect(0, 0, 1080, 1920);
const cast = [
  [{ costume: 'hoodie_green', hat: 'beanie', hair: '#4a2f1e', mood: 'neutral' }, 300, 1150, 1.05, 'idle', 'smug', null],
  [{ costume: 'jacket_purple', hat: 'cap', facial: 'moustache', mood: 'smug' }, 780, 1150, 1.05, 'hold', 'smug', 'shotgun'],
  [{ costume: 'ghillie', hat: 'hood_leafy', mood: 'smug' }, 250, 1850, 1.15, 'aim', 'determined', 'sniper'],
  [{ costume: 'tracksuit_yellow', hat: 'bandana', mood: 'happy' }, 620, 1850, 1.15, 'dance', 'happy', null],
  [{ costume: 'tee_red', hat: 'headset', mood: 'angry' }, 930, 1850, 1.0, 'idle', 'shocked', null],
];
for (const [def, x, y, sc, action, mood, prop] of cast) drawCharacterRC(g, def, { x, y, scale: sc, t: 1.3, action, mood, prop, blink: 0, gaze: [0.2, 0], yaw: 0.15 });
window.ready = true;
</script></body></html>
